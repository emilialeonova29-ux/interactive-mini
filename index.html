<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>INTERACTIVE-MINI</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f8fb;color:#203040}
    .msg{max-width:720px;margin:48px auto;padding:24px;background:#fff;border:1px solid #dce4ec;border-radius:16px}
    iframe{border:0;width:100vw;height:100vh;display:block;background:#fff}
  </style>
</head>
<body>
<div id="host"><div class="msg">Загружаю MINI…</div></div>
<script>
const API="https://acfuzhmqjdaypnhfabec.supabase.co/functions/v1/mini-api";
const DEFAULT_RESOURCE="MINI-RU-CASE-DECL-001";

(async()=>{
  const host=document.getElementById("host");
  const params=new URLSearchParams(location.search);
  const resourceId=(params.get("r")||DEFAULT_RESOURCE).trim();

  try{
    const res=await fetch(API+"?action=content&r="+encodeURIComponent(resourceId),{cache:"no-store"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    const data=await res.json();
    if(!data.html) throw new Error("Published HTML missing");

    document.title=data.title ? data.title+" — INTERACTIVE-MINI" : "INTERACTIVE-MINI";

    const frame=document.createElement("iframe");
    frame.title=data.title||"INTERACTIVE-MINI";
    frame.srcdoc=data.html;
    host.replaceWith(frame);
  }catch(e){
    host.innerHTML='<div class="msg"><strong>MINI не открылся.</strong><br>Обновите страницу. Если ошибка повторится, проверьте, опубликован ли ресурс.</div>';
  }
})();
</script>
</body>
</html>
