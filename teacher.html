<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INTERACTIVE-MINI — преподаватель</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#203040;--muted:#6b7a89;--line:#dce4ec;--accent:#315f86}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:980px;margin:auto;padding:28px 16px 60px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}h1{margin:0 0 6px}h2{margin:0 0 14px}
.sub,.meta{color:var(--muted)}label{display:block;font-weight:700;margin:12px 0 6px}
input,select{width:100%;padding:11px;border:1px solid #bfd1de;border-radius:11px;font:inherit}
button{border:1px solid var(--line);border-radius:11px;padding:10px 13px;background:#fff;font:inherit;font-weight:800;cursor:pointer}
.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notice{margin-top:14px;padding:12px;background:#edf3f8;border-radius:12px;word-break:break-word}.hidden{display:none}
.item{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:10px}.title{font-weight:800;margin:4px 0}
.status{display:inline-block;margin-top:7px;padding:5px 9px;border-radius:999px;background:#eef2f6;font-size:12px;font-weight:800}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main>
<div id="auth" class="card hidden">
  <h2>Доступ преподавателя</h2>
  <div class="sub">Откройте персональную teacher-ссылку или вставьте ключ один раз.</div>
  <label>Ключ</label><input id="key" type="password">
  <div class="actions"><button class="primary" id="save">Сохранить</button></div>
</div>

<div id="app" class="hidden">
  <h1>INTERACTIVE-MINI</h1>
  <div class="sub">Назначения и MINI RESULTS INBOX</div>
  <div class="grid" style="margin-top:20px">
    <section class="card">
      <h2>Назначить MINI</h2>
      <label>Ученик</label><input id="student" placeholder="Например, Дима Новосибирск">
      <label>MINI</label><select id="resource"><option>Загрузка…</option></select>
      <div class="actions"><button class="primary" id="create">Создать ссылку</button></div>
      <div id="created" class="notice hidden"></div>
    </section>

    <section class="card">
      <div style="display:flex;justify-content:space-between;gap:10px">
        <h2>MINI RESULTS INBOX</h2><button id="refresh">Обновить</button>
      </div>
      <div id="inbox"><div class="meta">Загрузка…</div></div>
    </section>
  </div>
</div>
</main><script>
const API="https://acfuzhmqjdaypnhfabec.supabase.co/functions/v1/mini-stage2";
const REG="https://acfuzhmqjdaypnhfabec.supabase.co/functions/v1/mini-api?action=registry";
const K="interactiveMini.teacherKey.v1";
let tk="";

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

function initKey(){
  if(location.hash.startsWith("#k=")){
    const v=decodeURIComponent(location.hash.slice(3));
    if(v){localStorage.setItem(K,v);history.replaceState(null,"",location.pathname+location.search)}
  }
  return localStorage.getItem(K)||"";
}

async function call(body){
  const r=await fetch(API,{
    method:"POST",
    headers:{"content-type":"application/json","x-mini-teacher-key":tk},
    body:JSON.stringify(body),
    cache:"no-store"
  });
  const d=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(d.error||("HTTP "+r.status));
  return d;
}

async function resources(){
  const r=await fetch(REG,{cache:"no-store"}),d=await r.json();
  resource.innerHTML=(d.resources||[]).map(x=>
    '<option value="'+esc(x.resource_id)+'">'+esc(x.title)+' · v'+esc(x.current_version)+'</option>'
  ).join("");
}

function childUrl(t){
  const u=new URL("./",location.href);
  u.search="";
  u.hash="a="+encodeURIComponent(t);
  return u.toString();
}

async function copy(t){
  try{
    await navigator.clipboard.writeText(t);
    return true;
  }catch(e){
    prompt("Скопируйте:",t);
    return true;
  }
}

function label(s){
  return s==="sent_to_hq"?"ПЕРЕДАНО В ШТАБ":s==="processed"?"ОБРАБОТАНО":"НОВОЕ";
}

function factsForHQ(x){
  const r=x.result||{};
  const a=Array.isArray(r.answers)?r.answers:[];
  const w=a.filter(v=>v&&v.correct===false);

  let s=
`INTERACTIVE-MINI — RESULT FACT BLOCK

Ученик: ${x.studentLabel}
MINI: ${x.title}
Resource: ${x.resourceId} v${x.resourceVersion}
Статус: выполнено.
`;

  if(r.score!=null&&r.totalTasks!=null){
    s+=`Результат: ${r.score}/${r.totalTasks}.
`;
  }

  if(w.length){
    s+="Ошибки:\n"+w.map(v=>
      `— задание ${v.taskIndex}: ${v.statement||""}; выбран «${v.selected||""}», верный — «${v.expected||""}».`
    ).join("\n")+"\n";
  }else{
    s+="Ошибки: не зафиксированы.\n";
  }

  s+=`Завершено: ${x.completedAt||""}

ДЛЯ УЧЕБНОГО ШТАБА:
Это подтверждённый результат самостоятельного выполнения MINI.
Обработай его по актуальному стандарту как новый учебный факт:
Журнал → актуализация Планов → следующий конкретный педагогический шаг → проверка уже подготовленного → Библиотека → структура следующего урока → необходимость новой подготовки.
Не придумывай ошибки, динамику, домашнее задание или выводы, которых нет в этом блоке.
В конце зафиксируй статус следующего урока: ГОТОВ / ТРЕБУЕТ КОНКРЕТНОЙ ПОДГОТОВКИ / НЕДОСТАТОЧНО ДАННЫХ.`;

  return s;
}

async function sendToHQ(x,el){
  const ok=await copy(factsForHQ(x));
  if(!ok)return;
  await call({action:"set_inbox_status",id:x.id,status:"sent_to_hq"});
  await inboxLoad();
}

async function inboxLoad(){
  inbox.innerHTML='<div class="meta">Загрузка…</div>';
  try{
    const d=await call({action:"inbox"}),items=d.items||[];
    if(!items.length){
      inbox.innerHTML='<div class="meta">Пока нет выполненных MINI.</div>';
      return;
    }

    inbox.innerHTML=items.map(x=>
      '<div class="item" data-id="'+esc(x.id)+'">'+
      '<div class="meta">'+esc(x.studentLabel)+'</div>'+
      '<div class="title">'+esc(x.title)+'</div>'+
      '<div>'+(x.result?.score!=null?esc(x.result.score+"/"+x.result.totalTasks):"результат сохранён")+'</div>'+
      '<span class="status">'+label(x.inboxStatus)+'</span>'+
      '<div class="actions">'+
      '<button class="primary" data-a="hqcopy">В Учебный штаб</button>'+
      '<button data-a="p">Обработано</button>'+
      '</div></div>'
    ).join("");

    document.querySelectorAll(".item").forEach(el=>{
      const x=items.find(v=>v.id===el.dataset.id);
      el.querySelector('[data-a="hqcopy"]').onclick=()=>sendToHQ(x,el);
      el.querySelector('[data-a="p"]').onclick=async()=>{
        await call({action:"set_inbox_status",id:x.id,status:"processed"});
        inboxLoad();
      };
    });
  }catch(e){
    inbox.innerHTML='<div class="meta">Ошибка: '+esc(e.message)+'</div>';
  }
}

async function start(){
  tk=initKey();

  if(!tk){
    auth.classList.remove("hidden");
    save.onclick=()=>{
      const v=key.value.trim();
      if(v){localStorage.setItem(K,v);location.reload()}
    };
    return;
  }

  app.classList.remove("hidden");
  const pre=new URLSearchParams(location.search).get("student");
  if(pre)student.value=pre;

  try{await resources()}
  catch(e){resource.innerHTML="<option>Ошибка загрузки</option>"}

  create.onclick=async()=>{
    const out=created,s=student.value.trim();
    if(!s){
      out.textContent="Укажите ученика.";
      out.classList.remove("hidden");
      return;
    }
    try{
      const d=await call({action:"create_assignment",studentLabel:s,resourceId:resource.value});
      const u=childUrl(d.token);
      out.innerHTML='Ссылка создана:<br><strong>'+esc(u)+'</strong>'+
        '<div class="actions"><button id="cp">Копировать ссылку</button></div>';
      out.classList.remove("hidden");
      cp.onclick=()=>copy(u);
    }catch(e){
      out.textContent="Ошибка: "+e.message;
      out.classList.remove("hidden");
    }
  };

  refresh.onclick=inboxLoad;
  inboxLoad();
}

start();
</script></body></html>
